site_name: Aha Studio
site_description: CLI tools for Aha.io with AQL, MCP server, SQLite sync, and Neo4j graph analytics
site_url: https://grokify.github.io/aha-studio
repo_url: https://github.com/grokify/aha-studio
repo_name: grokify/aha-studio

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Console: console.html
  - Getting Started:
      - Installation: getting-started/installation.md
      - Setup: getting-started/setup.md
      - Quick Start: getting-started/quickstart.md
  - AQL:
      - Syntax: aql/syntax.md
      - Entities: aql/entities.md
  - Tools Reference:
      - Overview: tools/overview.md
      - Write Tools: tools/write-tools.md
  - CLI:
      - Commands: cli/commands.md
  - Packages:
      - omnisignal: packages/omnisignal.md
  - Configuration:
      - Credentials: configuration/credentials.md
      - Environment Variables: configuration/environment.md
      - Claude Desktop: configuration/claude-desktop.md
  - Releases:
      - v0.11.0: releases/v0.11.0.md
      - v0.10.0: releases/v0.10.0.md
      - v0.9.0: releases/v0.9.0.md
      - v0.8.0: releases/v0.8.0.md
      - v0.7.0: releases/v0.7.0.md
      - v0.6.0: releases/v0.6.0.md
  - Specs:
      - Roadmap: specs/ROADMAP.md
      - Roadmap History: specs/ROADMAP_HISTORY.md
      - Architecture: specs/ARCHITECTURE.md
      - Product Requirements: specs/PRD.md
      - Technical Requirements: specs/TRD.md
      - Implementation Plan: specs/PLAN.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/grokify/aha-studio
